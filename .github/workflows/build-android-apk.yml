
name: Build Qestas Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  CI: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

    
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --package-lock=false \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7 \
            @capacitor/status-bar@7


      - name: Build web app
        run: npm run build

      - name: Create Android project and sync
        run: |
          npx cap add android
          npx cap sync android

    
      - name: Configure Android system bars
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path("android/app/src/main").rglob("MainActivity.java"))

          if len(files) != 1:
              raise SystemExit(f"Expected 1 MainActivity.java, found {len(files)}")

          file = files[0]
          source = file.read_text()

          if "WindowCompat.setDecorFitsSystemWindows" not in source:
              import_line = "import com.getcapacitor.BridgeActivity;"
              if import_line not in source:
                  raise SystemExit("BridgeActivity import not found")

              source = source.replace(
                  import_line,
                  import_line + "\nimport android.os.Bundle;\nimport androidx.core.view.WindowCompat;",
                  1
              )

              class_line = "public class MainActivity extends BridgeActivity {"
              if class_line not in source:
                  raise SystemExit("MainActivity class declaration not found")

              source = source.replace(
                  class_line,
                  class_line + """
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
              }
              """,
                  1
              )

          if "WindowCompat.setDecorFitsSystemWindows" not in source:
              raise SystemExit("System bar configuration was not applied")

          file.write_text(source)
          print(f"System bar configuration verified: {file}")
          PY


      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qestas-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

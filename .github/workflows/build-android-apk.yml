
name: Build Qestas Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  CI: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7 \
            @capacitor/status-bar@7

      - name: Build web app
        run: npm run build

      - name: Create Android project and sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android system bars
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path("android/app/src/main").rglob("MainActivity.java"))

          if not files:
              raise SystemExit("MainActivity.java not found")

          for file in files:
              source = file.read_text()

              if "WindowCompat.setDecorFitsSystemWindows" in source:
                  continue

              source = source.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\n"
                  "import android.os.Bundle;\n"
                  "import androidx.core.view.WindowCompat;"
              )

              source = source.replace(
                  "public class MainActivity extends BridgeActivity {",
                  """public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
                  super.onCreate(savedInstanceState);
              }"""
              )

              file.write_text(source)

          print("Android system bar configuration applied.")
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qestas-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
